<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emiliano Ramírez</title>
  <meta name="description" content="Emiliano Ramírez">
  <style>
    :root {
      --bg: #fafafa;
      --text: #1c1c1e;
      --muted: #6b7280;
      --accent: #4682b4; /* steelblue */
      --line: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --text: #f2f2f3;
        --muted: #9ca3af;
        --accent: #7fb2de;
        --line: #2a2a2e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .photo {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 1.75rem;
      background: var(--line);
    }
    h1 {
      margin: 0 0 1.75rem;
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 1.75rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 1rem;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color .15s, border-color .15s;
    }
    a svg { width: 1.1em; height: 1.1em; fill: var(--accent); }
    a:hover { color: var(--text); border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  </style>
</head>
